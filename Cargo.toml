[package]
name = "center"
version = "0.1.0"
edition = "2021"

[dependencies]
# color console
anstream = "0.6.15"
owo-colors = "4.1.0"

# log
tracing = "0.1"
tracing-subscriber = "0.3.0"

# clap
clap = { version = "4.5.18", features = ["derive", "cargo"] }
shlex = "1.3.0"

chrono = "0.4.38"
crossbeam-channel = "0.5.13"
libloading = "0.8.5"
tokio = { version = "1", features = ["full"] }

common = { path = "../common" }
